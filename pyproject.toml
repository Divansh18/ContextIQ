[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contextiq"
version = "0.1.0"
description = "A lightweight RAG knowledge assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch>=9.0,<10.0",
    "fastapi>=0.115,<1.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "openai>=1.0,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
